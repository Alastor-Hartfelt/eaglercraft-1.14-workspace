name: Build Eaglercraft 1.14 WASM-GC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile WASM-GC bootstrap
        working-directory: target_teavm_wasm_gc
        run: |
          mkdir -p javascript_dist
          java -jar buildtools/closure-compiler.jar \
            --compilation_level ADVANCED_OPTIMIZATIONS \
            --assume_function_wrapper \
            --emit_use_strict \
            --isolation_mode IIFE \
            --js ../src/wasm-gc-teavm-bootstrap/js/externs.js \
            --js ../src/wasm-gc-teavm-bootstrap/js/main.js \
            --js_output_file javascript_dist/bootstrap.js

      - name: Build WASM-GC client
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle --no-daemon

      - name: Prepare GitHub Pages entry point
        working-directory: target_teavm_wasm_gc/javascript_dist
        run: cp Eaglercraft_1.14.4_WASM-GC_Offline_Download.html index.html

      - name: Verify playable bundle
        run: |
          test -f target_teavm_wasm_gc/javascript_dist/index.html
          test -f target_teavm_wasm_gc/javascript_dist/bootstrap.js
          test -f target_teavm_wasm_gc/javascript_dist/assets.epw
          echo "Playable WASM-GC bundle created successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload playable client
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./target_teavm_wasm_gc/javascript_dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
