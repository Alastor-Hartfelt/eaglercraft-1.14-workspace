name: Build Eaglercraft 1.14 WASM-GC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build WASM-GC client
        run: ./gradlew :target_teavm_wasm_gc:makeMainWasmClientBundle --no-daemon

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload playable client
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./target_teavm_wasm_gc/javascript_dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
